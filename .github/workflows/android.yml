name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Create Gradle Wrapper Directory
      run: mkdir -p gradle/wrapper

    - name: Download Gradle Wrapper JAR
      run: curl -L https://github.com -o gradle/wrapper/gradle-wrapper.jar

    - name: Create Base Gradlew Script
      run: |
        echo '#!/bin/sh' > gradlew
        echo 'DIR="$(cd "$(dirname "$0")" && pwd)"' >> gradlew
        echo 'exec java -Xmx64m -Xms64m -Dorg.gradle.appname=gradlew -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
