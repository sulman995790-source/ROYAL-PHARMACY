name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Generate Global Keystore Assets
      # Creates the key in the root, inside app, and inside the double-nested folder to cover every possibility
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p app && cp debug.keystore app/
        mkdir -p ROYAL-PHARMACY/app && cp debug.keystore ROYAL-PHARMACY/app/

    - name: Patch Hardcoded Build Script Paths
      # Dynamically fixes any broken relative path references inside your build files automatically
      run: |
        find . -name "build.gradle.kts" -o -name "build.gradle" | xargs sed -i 's|debug.keystore|${rootDir}/app/debug.keystore|g' || true

    - name: Build Debug APK
      run: gradle assembleDebug
      
