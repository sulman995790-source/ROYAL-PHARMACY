name: Build Signed Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Regenerate Gradle Wrapper Files
      run: gradle wrapper --gradle-version 9.3.1

    - name: Generate Permanent Secure Keystore
      env:
        STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass "$STORE_PASS" -alias royalpharmacykey -keypass "$STORE_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Royal Pharmacy,O=Production,C=US"
        mkdir -p app && cp debug.keystore app/
        mkdir -p ROYAL-PHARMACY && cp debug.keystore ROYAL-PHARMACY/
        mkdir -p ROYAL-PHARMACY/ROYAL-PHARMACY && cp debug.keystore ROYAL-PHARMACY/ROYAL-PHARMACY/
        mkdir -p ROYAL-PHARMACY/ROYAL-PHARMACY/app && cp debug.keystore ROYAL-PHARMACY/ROYAL-PHARMACY/app/

    - name: Make Gradle Wrapper Executable
      run: chmod +x ./gradlew

    - name: Build Signed Release APK
      env:
        STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        GRADLE_OPTS: -Djava.awt.headless=true
      run: |
        ./gradlew assembleRelease -q \
          -Pandroid.injected.signing.store.file=debug.keystore \
          -Pandroid.injected.signing.store.password="$STORE_PASS" \
          -Pandroid.injected.signing.key.alias=royalpharmacykey \
          -Pandroid.injected.signing.key.password="$STORE_PASS"

    - name: Upload Production Release APK
      uses: actions/upload-artifact@v4
      with:
        name: RoyalPharmacy-Production-Release-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Archive Production Keystore
      uses: actions/upload-artifact@v4
      with:
        name: secure-production-keystore-backup
        path: app/debug.keystore
        
