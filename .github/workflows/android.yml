name: Build Signed Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - run: gradle wrapper --gradle-version 9.3.1
    - run: chmod +x ./gradlew

    - name: Restore Permanent Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

    - name: Build Signed Release APK
      env:
        STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
          -Pandroid.injected.signing.store.password="$STORE_PASS" \
          -Pandroid.injected.signing.key.alias=royalpharmacykey \
          -Pandroid.injected.signing.key.password="$STORE_PASS"

    - uses: actions/upload-artifact@v4
      with:
        name: RoyalPharmacy-Production-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
