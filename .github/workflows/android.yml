name: Android CI - Build Royal Pharmacy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Ensure Gradle Wrapper Jar Exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Ensure debug.keystore Exists in CI
        run: |
          if [ ! -s "debug.keystore" ]; then
            rm -f debug.keystore
            if [ -s "debug.keystore.base64" ]; then
              base64 -di debug.keystore.base64 > debug.keystore || rm -f debug.keystore
            fi
          fi
          if [ ! -s "debug.keystore" ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure google-services.json Exists in CI
        run: |
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"844575165623","project_id":"gen-lang-client-0237361589","storage_bucket":"gen-lang-client-0237361589.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:844575165623:android:86156fda64cf18f738d132","android_client_info":{"package_name":"com.aistudio.royalpharmacy.kpvmrx"}},"oauth_client":[{"client_id":"844575165623-jvjaiijj4iecqdn58ta3o8401nko5hg9.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyB8ww3Pqdn8Ntu6WArA20SmM3Ck-0VsMpc"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Inject Gemini 4 API Key from GitHub Secrets
        run: |
          API_KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="DEFAULT_GEMINI_API_KEY"
          fi
          echo "GEMINI_API_KEY=$API_KEY" > .env
          echo "RELEASE_KEYSTORE_PASSWORD=@sk1234SS" >> .env

      - name: Build Debug APK
        run: |
          if command -v xvfb-run > /dev/null 2>&1; then
            xvfb-run -a ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache
          else
            ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache
          fi

      - name: Upload Compiled Royal Pharmacy APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Pharmacy-v4-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
