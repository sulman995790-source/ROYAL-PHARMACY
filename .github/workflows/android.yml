name: Android CI - Build Royal Pharmacy APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Jar Exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Ensure google-services.json Exists in CI
        run: |
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"1234567890","project_id":"royal-pharmacy-app","storage_bucket":"royal-pharmacy-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:abcdef0123456789","android_client_info":{"package_name":"com.aistudio.royalpharmacy.kpvmrx"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly12345678"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Inject Gemini 4 API Key from GitHub Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace -Djava.awt.headless=true --no-daemon

      - name: Upload Compiled Royal Pharmacy APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Pharmacy-v4-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
