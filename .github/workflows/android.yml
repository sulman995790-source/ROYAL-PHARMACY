name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Generate Global Keystore Instances
      # Creates copies of the file across every folder level to ensure it is found
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p app && cp debug.keystore app/
        mkdir -p ROYAL-PHARMACY && cp debug.keystore ROYAL-PHARMACY/
        mkdir -p ROYAL-PHARMACY/ROYAL-PHARMACY && cp debug.keystore ROYAL-PHARMACY/ROYAL-PHARMACY/
        mkdir -p ROYAL-PHARMACY/ROYAL-PHARMACY/app && cp debug.keystore ROYAL-PHARMACY/ROYAL-PHARMACY/app/

    - name: Build Debug APK
      run: gradle assembleDebug
      
